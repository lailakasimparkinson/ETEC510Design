<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creation Kit First Steps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky lesson rail on the left, one lesson at a time on the right. Rail becomes a scrolling tab strip on phones. */
:root {
  --bg: #e8ecef;
  --surface: #f6f8f9;
  --ink: #18202a;
  --muted: #55606c;
  --line: #c6ced5;
  --accent: #1d6a74;      /* glacier teal */
  --accent-ink: #ffffff;
  --ember: #a8651a;       /* forge amber, used for timestamps and hotkeys */
  --good: #2c7a47;
  --bad: #a83a32;
  --stage: #1c232b;       /* the "screen" the video sits on */
  --stage-ink: #c9d3dc;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171c; --surface: #1a2128; --ink: #e3e9ee; --muted: #93a0ad; --line: #2c3640;
    --accent: #5db7c2; --accent-ink: #0c1317; --ember: #e0a050; --good: #6cc48a; --bad: #e68a82;
    --stage: #0c1014; --stage-ink: #b5c1cc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171c; --surface: #1a2128; --ink: #e3e9ee; --muted: #93a0ad; --line: #2c3640;
  --accent: #5db7c2; --accent-ink: #0c1317; --ember: #e0a050; --good: #6cc48a; --bad: #e68a82;
  --stage: #0c1014; --stage-ink: #b5c1cc; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-inline: 16px; padding-block: 0 48px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd {
  font-family: var(--mono); font-size: 0.82em; background: var(--bg); border: 1px solid var(--line);
  border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--ember);
}

.top {
  max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding-block: 20px 16px;
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand small { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 3.4vw, 1.7rem); margin: 2px 0 0; letter-spacing: 0.02em; text-wrap: balance; }
.theme-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; flex: none; }

.shell { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; }
.rail { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px; }
.overall { font-size: 0.85rem; color: var(--muted); display: grid; gap: 6px; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.lessons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--line); }
.lessons button {
  width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid transparent; margin-left: -2px;
  padding: 9px 12px; display: flex; gap: 10px; align-items: baseline; color: var(--muted);
}
.lessons button:hover { color: var(--ink); }
.lessons button[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); font-weight: 600; background: var(--surface); }
.lessons .n { font-family: var(--mono); font-size: 0.78rem; flex: none; }
.lessons .tick { margin-left: auto; color: var(--good); font-weight: 600; visibility: hidden; flex: none; }
.lessons .done .tick { visibility: visible; }

.lesson { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.lesson h2 { font-family: var(--display); font-weight: 600; font-size: clamp(1.4rem, 3.6vw, 1.9rem); margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.lesson .lede { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.eyebrow { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ember); }
h3 { font-size: 0.78rem; font-family: var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 500; }

.stage { background: var(--stage); border-radius: 8px; overflow: hidden; color: var(--stage-ink); }
.screen { aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; position: relative; }
.screen video { width: 100%; height: 100%; display: block; background: #000; }
.slot { text-align: center; padding: 16px; display: grid; gap: 10px; justify-items: center; }
.slot b { font-family: var(--display); font-weight: 500; font-size: 1.05rem; color: #e6edf3; }
.slot span { font-size: 0.9rem; max-width: 40ch; }
.pick { background: transparent; border: 1px solid var(--stage-ink); color: var(--stage-ink); border-radius: 6px; padding: 6px 14px; font-size: 0.88rem; }
.pick:hover { background: rgba(255,255,255,.08); }
.chapters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-top: 1px solid rgba(255,255,255,.1); }
.chip { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: var(--stage-ink); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; }
.chip:hover { background: rgba(255,255,255,.14); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip time { font-family: var(--mono); font-size: 0.78em; margin-right: 6px; opacity: .8; }
.hint { padding: 0 12px 12px; font-size: 0.82rem; color: var(--stage-ink); opacity: .8; min-height: 1.4em; }

.cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps label { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px; border-radius: 6px; cursor: pointer; }
.steps label:hover { background: var(--bg); }
.steps li.now label { background: var(--bg); box-shadow: inset 3px 0 0 var(--ember); }
.steps input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); }
.steps input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.steps time { font-family: var(--mono); font-size: 0.78rem; color: var(--ember); padding-top: 2px; }

.quiz p { margin: 0 0 12px; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--bg)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--bg)); }
.fb { margin: 12px 0 0; font-size: 0.92rem; min-height: 1.4em; color: var(--muted); }

/* Interface tour built from real screenshots */
.tour { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; background: var(--stage); padding: 8px; border-radius: 8px; align-items: start; }
.shot { background: #000; border: 2px solid transparent; border-radius: 4px; padding: 0; overflow: hidden; display: block; position: relative; }
.shot img { display: block; width: 100%; height: auto; }
.shot.wide { grid-column: 1 / -1; }
.shot.tall { grid-row: span 2; }
.shot:hover { border-color: var(--accent); }
.shot[aria-pressed="true"] { border-color: var(--ember); box-shadow: 0 0 0 2px var(--ember); }
.shot .tag { position: absolute; left: 6px; bottom: 6px; font-family: var(--mono); font-size: 0.7rem; background: rgba(0,0,0,.78); color: #e6edf3; padding: 2px 8px; border-radius: 3px; }
.shot.wide .tag { left: auto; right: 6px; }
.shot[aria-pressed="true"] .tag { background: var(--ember); color: #14100a; }
.explain { margin-top: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--ember); border-radius: 6px; }
.explain b { font-family: var(--display); font-weight: 600; }
.explain p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }

.complete { background: var(--surface); border: 1px solid var(--accent); border-radius: 8px; padding: 20px; margin-bottom: 24px; display: grid; gap: 10px; }
.complete h2 { font-family: var(--display); font-weight: 600; font-size: clamp(1.3rem, 3.4vw, 1.7rem); margin: 0; }
.complete p { margin: 0; color: var(--muted); max-width: 60ch; }
.complete .acts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.nav-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 9px 18px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.note { font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; max-width: 70ch; }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .rail { position: static; }
  .lessons { flex-direction: row; overflow-x: auto; border-left: 0; border-bottom: 2px solid var(--line); gap: 0; padding-bottom: 0; }
  .lessons li { flex: none; }
  .lessons button { border-left: 0; margin-left: 0; border-bottom: 2px solid transparent; margin-bottom: -2px; width: auto; white-space: nowrap; }
  .lessons button[aria-current="true"] { border-bottom-color: var(--accent); background: none; }
  .lessons .tick { margin-left: 4px; }
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

:root { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>


<header class="top">
  <div class="brand">
    <small>Interactive how-to</small>
    <h1>Skyrim Creation Kit, first steps</h1>
  </div>
  <button class="theme-btn" id="themeBtn" type="button">Theme</button>
</header>

<div class="shell">
  <aside class="rail">
    <div class="overall"><span id="overallText">0 of 5 lessons done</span><div class="bar"><i id="overallBar"></i></div></div>
    <ul class="lessons" id="nav"></ul>
  </aside>
  <main id="main"></main>
</div>

<script>
(function () {
  var LESSONS = [
    {
      id: "l1", title: "Meet the windows", short: "Windows",
      lede: "The Creation Kit opens into a handful of windows. Learn which one does what before you touch anything.",
      video: "media/lesson1.mp4",
      chapters: [{ t: 0, label: "Open from Steam" }, { t: 12, label: "Launch" }, { t: 20, label: "Main window" }, { t: 28, label: "Arrange windows" }],
      steps: [
        { t: 0,  text: "Open Steam and find Skyrim Special Edition: Creation Kit in your library." },
        { t: 12, text: "Press Launch and wait for the Creation Kit to start." },
        { t: 16, text: "If a warning dialog appears on startup, read it and press OK." },
        { t: 20, text: "The main window opens. The menu bar and toolbar run along the top." },
        { t: 28, text: "Find the Object Window, Cell View and Render Window, then drag them into an arrangement you like." }
      ],
      quiz: { q: "Which window shows the 3D view of a cell?", opts: ["Object Window", "Render Window", "Cell View"], a: 1, why: "The Render Window is the 3D view. The Object Window lists forms and the Cell View lists cells." },
      map: true
    },
    {
      id: "l2", title: "Load game data", short: "Load data",
      lede: "Before you can edit, tell the Creation Kit which plugins to load and which one receives your changes.",
      video: "media/lesson2.mp4",
      chapters: [{ t: 0, label: "Main window" }, { t: 6, label: "File menu" }, { t: 9, label: "Data dialog" }, { t: 12, label: "Pick plugins" }, { t: 22, label: "Loading" }],
      steps: [
        { t: 6,  text: "Open the File menu and choose Data. The plugin list opens." },
        { t: 12, text: "Tick Skyrim.esm so the base game content loads, plus any other plugins you need." },
        { t: 18, text: "To save changes into a plugin, select it and press Set as Active File." },
        { t: 22, text: "Press OK and wait for the loading bar to finish." }
      ],
      quiz: { q: "What does the Active File do?", opts: ["It is the plugin your edits are saved into", "It is the plugin that loads first", "It is the newest plugin on disk"], a: 0, why: "Everything you change is written to the Active File when you save." }
    },
    {
      id: "l3", title: "Open a cell", short: "Open a cell",
      lede: "A cell is one chunk of the game world, like a room or a square of landscape. You need one loaded to place anything.",
      video: "media/lesson3.mp4",
      chapters: [{ t: 0, label: "Set up windows" }, { t: 12, label: "Browse cells" }, { t: 33, label: "Open a cell" }, { t: 45, label: "Look around" }],
      steps: [
        { t: 0,  text: "Arrange the Cell View and Render Window so you can see both." },
        { t: 12, text: "In the Cell View, check the World Space dropdown, then scroll the cell list to find a cell." },
        { t: 33, text: "Double-click the cell you want. A loading bar appears." },
        { t: 45, text: "The cell fills the Render Window." },
        { t: 50, text: "Move the camera to look around the cell." }
      ],
      quiz: { q: "How do you load a cell into the Render Window?", opts: ["Drag it from the Object Window", "Double-click it in the Cell View", "Press Ctrl+S"], a: 1, why: "Double-clicking a cell in the Cell View loads it." }
    },
    {
      id: "l4", title: "Place and move an object", short: "Place objects",
      lede: "Find an item in the Object Window, put it in the cell, then nudge it into position.",
      video: "media/lesson4.mp4",
      chapters: [{ t: 0, label: "Browse objects" }, { t: 40, label: "Pick an item" }, { t: 53, label: "Rotate" }, { t: 65, label: "Move" }],
      steps: [
        { t: 0,  text: "In the Object Window, expand a category in the tree on the left." },
        { t: 20, text: "Browse the list on the right until you find an item to place." },
        { t: 40, text: "Select the item and drag it into the Render Window." },
        { t: 53, text: "Click the placed object. A rotation ring appears around it." },
        { t: 65, text: "Switch to the move tool and drag the arrows to slide the object into position." },
        { t: 85, text: "Switch back to rotate to turn it. Use the toolbar, or W for move and E for rotate." }
      ],
      quiz: { q: "Which key switches to the rotate tool?", opts: ["W", "E", "R"], a: 1, why: "W is move, E is rotate and R is scale." }
    },
    {
      id: "l5", title: "Save your plugin", short: "Save",
      lede: "Your changes live in a plugin file. Save often, and keep a backup of anything you care about.",
      video: "media/lesson5.mp4",
      chapters: [{ t: 0, label: "Your edit" }, { t: 21, label: "File menu" }, { t: 24, label: "Name the file" }, { t: 39, label: "Check it saved" }],
      steps: [
        { t: 0,  text: "With your changes made, you are ready to save." },
        { t: 21, text: "Open the File menu and choose Save. A Select Target Plugin window opens." },
        { t: 27, text: "Type a file name for your plugin and press Save." },
        { t: 39, text: "To confirm, open File, then Data. Your plugin appears in the list." }
      ],
      quiz: { q: "What file extension does a standard plugin use?", opts: [".esp", ".exe", ".mp4"], a: 0, why: "ESP stands for Elder Scrolls Plugin." }
    }
  ];

  var PANES = {
    menu:   { name: "Menu bar and toolbar", text: "File, Edit, View, World and the rest. File, then Data is where you choose which plugins to load, and Save is here too. The icons below are shortcuts to common tools.", go: 1 },
    object: { name: "Object Window", text: "Every form in your loaded data, sorted into a tree: Actors, Items, WorldObjects and more. Pick a category on the left and the list fills in on the right. Use the Filter box to search.", go: 3 },
    render: { name: "Render Window", text: "The 3D view. It stays grey until you open a cell. Once a cell is loaded, click objects here to select them and use the move, rotate and scale tools.", go: 3 },
    cell:   { name: "Cell View", text: "Pick a world space at the top, then choose a cell from the list. Double-click a cell to bring it into the Render Window.", go: 2 }
  };

  var KEY = "ck-howto-v1";
  var state = { done: {}, quiz: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.done) state = p; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var cur = 0;
  var nav = document.getElementById("nav");
  var main = document.getElementById("main");

  function fmt(t) { var m = Math.floor(t / 60), s = t % 60; return m + ":" + (s < 10 ? "0" : "") + s; }
  function stepsDone(l) { return (state.done[l.id] || []).length; }
  function lessonDone(l) { return stepsDone(l) === l.steps.length && state.quiz[l.id] === true; }

  function renderNav() {
    nav.innerHTML = "";
    var count = 0;
    LESSONS.forEach(function (l, i) {
      var d = lessonDone(l); if (d) count++;
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = d ? "done" : "";
      if (i === cur) b.setAttribute("aria-current", "true");
      b.innerHTML = '<span class="n">' + (i + 1) + '</span><span>' + l.short + '</span><span class="tick" aria-label="completed">&#10003;</span>';
      b.addEventListener("click", function () { go(i); });
      li.appendChild(b); nav.appendChild(li);
    });
    document.getElementById("overallText").textContent = count + " of " + LESSONS.length + " lessons done";
    document.getElementById("overallBar").style.width = (count / LESSONS.length * 100) + "%";
    updateComplete();
  }

  function updateComplete() {
    var old = document.getElementById("complete"); if (old) old.remove();
    if (!LESSONS.every(lessonDone)) return;
    var c = document.createElement("section"); c.id = "complete"; c.className = "complete";
    c.innerHTML = '<div class="eyebrow">All lessons finished</div><h2>Course complete</h2><p>You have opened the Creation Kit, loaded game data, opened a cell, placed an object and saved your plugin. You now know the basic loop for every mod you make.</p><div class="acts"></div>';
    var acts = c.querySelector(".acts");
    var rev = document.createElement("button"); rev.type = "button"; rev.className = "btn"; rev.textContent = "Review from lesson 1";
    rev.addEventListener("click", function () { go(0); });
    var rst = document.createElement("button"); rst.type = "button"; rst.className = "btn ghost"; rst.textContent = "Reset my progress";
    rst.addEventListener("click", function () { state = { done: {}, quiz: {} }; save(); go(0); });
    acts.appendChild(rev); acts.appendChild(rst);
    main.insertBefore(c, main.firstChild);
  }

  function go(i) {
    cur = Math.max(0, Math.min(LESSONS.length - 1, i));
    try { history.replaceState(null, "", "#l" + (cur + 1)); } catch (e) {}
    renderNav(); renderLesson();
    window.scrollTo(0, 0);
  }

  function renderLesson() {
    var l = LESSONS[cur];
    main.innerHTML = "";
    var wrap = document.createElement("article");
    wrap.className = "lesson";

    var head = document.createElement("div");
    head.innerHTML = '<div class="eyebrow">Lesson ' + (cur + 1) + ' of ' + LESSONS.length + '</div><h2></h2><p class="lede"></p>';
    head.querySelector("h2").textContent = l.title;
    head.querySelector(".lede").textContent = l.lede;
    wrap.appendChild(head);

    /* Video stage */
    var stage = document.createElement("div"); stage.className = "stage";
    var screen = document.createElement("div"); screen.className = "screen";
    var video = null;
    var slot = document.createElement("div"); slot.className = "slot";
    slot.innerHTML = '<b>Your recording for lesson ' + (cur + 1) + ' goes here</b><span>Pick a clip from your computer to preview how it will play with the chapters and steps below.</span>';
    var input = document.createElement("input"); input.type = "file"; input.accept = "video/*"; input.hidden = true; input.id = "file-" + l.id;
    var pick = document.createElement("button"); pick.type = "button"; pick.className = "pick"; pick.textContent = "Preview a clip";
    pick.addEventListener("click", function () { input.click(); });
    slot.appendChild(pick); slot.appendChild(input);
    if (!l.video) screen.appendChild(slot);
    stage.appendChild(screen);

    var chapters = document.createElement("div"); chapters.className = "chapters";
    var hint = document.createElement("div"); hint.className = "hint"; hint.textContent = "Chapters jump to that moment in the video.";
    var chips = l.chapters.map(function (c, ci) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip";
      b.innerHTML = "<time>" + fmt(c.t) + "</time>" + c.label;
      b.addEventListener("click", function () { seek(c.t); });
      chapters.appendChild(b); return b;
    });
    stage.appendChild(chapters); stage.appendChild(hint);

    function attachVideo(src) {
      screen.innerHTML = "";
      video = document.createElement("video"); video.controls = true; video.playsInline = true; video.preload = "metadata"; video.src = src;
      screen.appendChild(video);
      video.addEventListener("timeupdate", sync);
      hint.textContent = "Chapters and steps follow the video.";
    }
    input.addEventListener("change", function () {
      var f = input.files && input.files[0]; if (!f) return;
      try { attachVideo(URL.createObjectURL(f)); } catch (e) { hint.textContent = "This viewer could not play that clip. Try an MP4."; }
    });
    if (l.video) attachVideo(l.video);

    function seek(t) {
      if (!video) { hint.textContent = "Load a clip first, then chapters will jump to " + fmt(t) + "."; return; }
      video.currentTime = t; video.play().catch(function () {});
    }

    /* Optional annotated mock of the interface */
    if (l.map) wrap.appendChild(buildMap());
    wrap.appendChild(stage);

    /* Steps + quiz */
    var cols = document.createElement("div"); cols.className = "cols";
    var sp = document.createElement("section"); sp.className = "panel";
    sp.innerHTML = "<h3>Steps</h3>";
    var ul = document.createElement("ul"); ul.className = "steps";
    var lis = l.steps.map(function (s, si) {
      var li = document.createElement("li");
      var lab = document.createElement("label");
      var cb = document.createElement("input"); cb.type = "checkbox"; cb.id = l.id + "-s" + si;
      cb.checked = (state.done[l.id] || []).indexOf(si) > -1;
      cb.addEventListener("change", function () {
        var arr = state.done[l.id] || [];
        arr = arr.filter(function (x) { return x !== si; });
        if (cb.checked) arr.push(si);
        state.done[l.id] = arr; save(); renderNav();
      });
      var tx = document.createElement("span"); tx.innerHTML = s.text.replace(/\b(Ctrl\+S|W|E|R)\b(?= (to|is|,)|,|\.| or)/g, "<kbd>$1</kbd>");
      var tm = document.createElement("time"); tm.textContent = fmt(s.t);
      lab.appendChild(cb); lab.appendChild(tx); lab.appendChild(tm);
      li.appendChild(lab); ul.appendChild(li); return li;
    });
    sp.appendChild(ul);

    var qp = document.createElement("section"); qp.className = "panel quiz";
    qp.innerHTML = "<h3>Quick check</h3><p></p><div class='opts'></div><div class='fb' aria-live='polite'></div>";
    qp.querySelector("p").textContent = l.quiz.q;
    var opts = qp.querySelector(".opts"), fb = qp.querySelector(".fb");
    var btns = l.quiz.opts.map(function (o, oi) {
      var b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = o;
      b.addEventListener("click", function () {
        if (oi === l.quiz.a) {
          b.className = "opt right"; fb.textContent = "Correct. " + l.quiz.why;
          btns.forEach(function (x) { x.disabled = true; });
          state.quiz[l.id] = true; save(); renderNav();
        } else {
          b.className = "opt wrong"; b.disabled = true; fb.textContent = "Not quite. Try another answer.";
        }
      });
      opts.appendChild(b); return b;
    });
    if (state.quiz[l.id]) { btns[l.quiz.a].className = "opt right"; btns.forEach(function (x) { x.disabled = true; }); fb.textContent = l.quiz.why; }

    cols.appendChild(sp); cols.appendChild(qp);
    wrap.appendChild(cols);

    function sync() {
      var t = video ? video.currentTime : 0, ci = -1, si = -1;
      l.chapters.forEach(function (c, i) { if (t >= c.t) ci = i; });
      l.steps.forEach(function (s, i) { if (t >= s.t) si = i; });
      chips.forEach(function (c, i) { c.classList.toggle("on", i === ci); });
      lis.forEach(function (li, i) { li.classList.toggle("now", i === si); });
    }

    var row = document.createElement("div"); row.className = "nav-row";
    var prev = document.createElement("button"); prev.type = "button"; prev.className = "btn ghost"; prev.textContent = "Previous lesson"; prev.disabled = cur === 0;
    prev.addEventListener("click", function () { go(cur - 1); });
    var next = document.createElement("button"); next.type = "button"; next.className = "btn"; next.textContent = cur === LESSONS.length - 1 ? "Back to lesson 1" : "Next lesson";
    next.addEventListener("click", function () { go(cur === LESSONS.length - 1 ? 0 : cur + 1); });
    row.appendChild(prev); row.appendChild(next);
    wrap.appendChild(row);

    if (cur === 0) {
      var n = document.createElement("p"); n.className = "note";
      n.textContent = "Proof of concept. All five lessons use your recordings. Step wording and timestamps were drafted from the footage and may need small tweaks.";
      wrap.appendChild(n);
    }
    main.appendChild(wrap);
    updateComplete();
  }

  function buildMap() {
    var box = document.createElement("div");
    var h = document.createElement("h3"); h.textContent = "Tap a window to see what it does"; box.appendChild(h);
    var tour = document.createElement("div"); tour.className = "tour";
    var defs = [
      { k: "menu",   cls: "wide", src: "media/menu-bar.png",      alt: "Creation Kit menu bar and toolbar", tag: "Menu bar" },
      { k: "object", cls: "tall", src: "media/object-window.png", alt: "Object Window with a category tree and a list of forms", tag: "Object Window" },
      { k: "render", cls: "",     src: "media/render-window.png", alt: "Empty grey Render Window", tag: "Render Window" },
      { k: "cell",   cls: "",     src: "media/cell-view.png",     alt: "Cell View with world space dropdown and cell list", tag: "Cell View" }
    ];
    var exp = document.createElement("div"); exp.className = "explain"; exp.setAttribute("aria-live", "polite");
    var btns = {};
    function show(k) {
      var p = PANES[k];
      Object.keys(btns).forEach(function (x) { btns[x].setAttribute("aria-pressed", x === k ? "true" : "false"); });
      exp.innerHTML = "<b></b><p></p>";
      exp.querySelector("b").textContent = p.name;
      exp.querySelector("p").textContent = p.text;
      var a = document.createElement("button"); a.type = "button"; a.className = "btn ghost";
      a.style.cssText = "margin-top:10px;padding:6px 14px;font-size:0.88rem";
      a.textContent = "Go to lesson " + (p.go + 1) + ": " + LESSONS[p.go].short;
      a.addEventListener("click", function () { go(p.go); });
      exp.appendChild(a);
    }
    defs.forEach(function (d) {
      var b = document.createElement("button"); b.type = "button"; b.className = "shot " + d.cls;
      var img = document.createElement("img"); img.src = d.src; img.alt = d.alt; img.loading = "lazy";
      var tg = document.createElement("span"); tg.className = "tag"; tg.textContent = d.tag;
      b.appendChild(img); b.appendChild(tg);
      b.setAttribute("aria-pressed", "false"); b.setAttribute("aria-label", d.tag);
      b.addEventListener("click", function () { show(d.k); });
      btns[d.k] = b; tour.appendChild(b);
    });
    box.appendChild(tour); box.appendChild(exp);
    show("render");
    return box;
  }

  /* Theme toggle */
  var root = document.documentElement;
  document.getElementById("themeBtn").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    root.setAttribute("data-theme", dark ? "light" : "dark");
  });

  var m = /^#l(\d)$/.exec(location.hash);
  if (m) cur = Math.max(0, Math.min(LESSONS.length - 1, parseInt(m[1], 10) - 1));
  renderNav(); renderLesson();
})();
</script>

</body>
